name: PyPhysX
on: [ push ]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.8', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install freeglut3-dev
        if: runner.os == 'Linux'

      - name: Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade numpy
          python -m pip install codecov pyrender imageio imageio_ffmpeg trimesh pycollada networkx numba numpy_quaternion matplotlib scipy anytree meshcat pytest-cov

      - name: Build and install
        run: python -m pip install .

      - name: Run tests and generate coverage report
        run: |
          pytest tests --cov=pyphysx --cov=pyphysx_utils --cov=pyphysx_render --cov-report=xml
        if: runner.os == 'Linux'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        if: runner.os == 'Linux'

