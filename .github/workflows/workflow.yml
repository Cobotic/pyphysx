name: PyPhysX
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PhysX 4.1.1 / Conan 1 need a supported, stable compiler toolchain.
        os: [ ubuntu-22.04, macos-15-intel, windows-2022 ]
        python-version: [ '3.8', '3.12' ]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CONAN_CPU_COUNT: 2
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install freeglut3-dev
        if: runner.os == 'Linux'

      - name: Select Linux compiler
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-11" >> "$GITHUB_ENV"
          echo "CXX=g++-11" >> "$GITHUB_ENV"

      - name: Select macOS compiler
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade numpy
          python -m pip install pyrender imageio imageio_ffmpeg trimesh pycollada networkx numba numpy_quaternion matplotlib scipy anytree meshcat pytest-cov

      - name: Build and install
        run: python -m pip install .

      - name: Run tests and generate coverage report
        run: |
          pytest tests --cov=pyphysx --cov=pyphysx_utils --cov=pyphysx_render --cov-report=xml
        if: runner.os == 'Linux'
      - name: Check native binding types
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m pip install pyright==1.1.414
          pyright --project pyrightconfig.json

      - name: Retain coverage report
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

